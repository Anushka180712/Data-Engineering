[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "de-pipeline"
version = "0.1.0"
description = "End-to-end data engineering showcase: ingestion -> cleaning -> lakehouse storage -> chunking -> embeddings -> vector store -> semantic search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "duckdb>=1.0",
    "numpy>=1.24",
    "pyyaml>=6",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "chromadb>=0.5",
    "faiss-cpu>=1.7.4",
]

[project.optional-dependencies]
# Neural embeddings (recommended). Pulls in torch; the model downloads from Hugging Face on first run.
neural = ["sentence-transformers>=2.7"]
dev = ["pytest>=7"]

[project.scripts]
de-pipeline = "de_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

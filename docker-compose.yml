# Data lake on S3-compatible object storage (SeaweedFS), pipeline in a container.
#
#   docker compose run --rm pipeline                      -> full pipeline, lake = s3://lakehouse
#   docker compose run --rm pipeline search "oil prices"  -> semantic search
#   docker compose run --rm pipeline catalog --ddl        -> Hive Metastore / Glue DDL
#   docker compose down                                   -> stop (add -v to wipe the lake)
#
# SeaweedFS is an Apache-2.0, S3-compatible object store. (MinIO's Docker images are no longer
# published on Docker Hub, so SeaweedFS is used instead; the pipeline only speaks the S3 API, so
# MinIO, Ceph, AWS S3 etc. work by changing AWS_ENDPOINT_URL and the credentials.)
#
# Browse the lake (raw/ bronze/ silver/ gold/) in the filer UI: http://localhost:8888/buckets/lakehouse/
services:
  s3:
    image: chrislusf/seaweedfs:4.52
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer web UI (browse buckets)
    volumes:
      - lake-data:/data
      - ./config/seaweedfs_s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  pipeline:
    build:
      context: .
      args:
        WITH_NEURAL: "true"     # set "false" for a tiny image using the offline LSA embedder
    image: de-pipeline:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      DE_PATHS__LAKE_URI: s3://lakehouse      # bucket is created on first run
      AWS_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: lakeadmin
      AWS_SECRET_ACCESS_KEY: lakeadmin-secret
      AWS_REGION: us-east-1
      DE_EMBEDDING__BACKEND: auto
      DE_VECTOR_STORE__BACKEND: chroma
    volumes:
      - ./data:/app/data        # catalog/metadata DB, vector store, artifacts
      - hf-cache:/root/.cache/huggingface

volumes:
  lake-data:
  hf-cache:

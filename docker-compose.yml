# Data lake on S3-compatible object storage (MinIO), pipeline in a container.
#
#   docker compose up -d minio minio-init                 -> start the object store, create bucket
#   docker compose run --rm pipeline                      -> full pipeline, lake = s3://lakehouse
#   docker compose run --rm pipeline search "oil prices"  -> semantic search
#   docker compose run --rm pipeline catalog --ddl        -> Hive Metastore / Glue DDL
#
# Browse the lake (raw/ bronze/ silver/ gold/) in the MinIO console: http://localhost:9001
# (user: minioadmin / password: minioadmin). On AWS, drop AWS_ENDPOINT_URL and use real creds.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:          # one-shot: create the lake bucket
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set lake http://minio:9000 minioadmin minioadmin &&
                  mc mb --ignore-existing lake/lakehouse"

  pipeline:
    build:
      context: .
      args:
        WITH_NEURAL: "true"     # set "false" for a tiny image using the offline LSA embedder
    image: de-pipeline:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      DE_PATHS__LAKE_URI: s3://lakehouse
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      DE_EMBEDDING__BACKEND: auto
      DE_VECTOR_STORE__BACKEND: chroma
    volumes:
      - ./data:/app/data        # catalog/metadata DB, vector store, artifacts
      - hf-cache:/root/.cache/huggingface

volumes:
  minio-data:
  hf-cache:
